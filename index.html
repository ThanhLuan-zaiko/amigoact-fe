<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AmigoACT — Nền tảng quản lý hoạt động tình nguyện sinh viên: sự kiện, tổ chức, bảng xếp hạng." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>AmigoACT | Hoạt động tình nguyện sinh viên</title>
    <script>
      (function () {
        try {
          var key = "amigoact-theme";
          var stored = localStorage.getItem(key);
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/login*" } },
                { "not": { "href_matches": "/register*" } },
                { "not": { "href_matches": "/verify*" } },
                { "not": { "href_matches": "/forgot-password*" } },
                { "not": { "href_matches": "/reset-password*" } },
                { "not": { "href_matches": "/profile*" } },
                { "not": { "href_matches": "/change-password*" } },
                { "not": { "href_matches": "/my-dashboard*" } },
                { "not": { "href_matches": "/manage*" } },
                { "not": { "href_matches": "/logout*" } },
                { "not": { "href_matches": "/auth/*" } },
                { "not": { "href_matches": "/export*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ],
        "prefetch": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/login*" } },
                { "not": { "href_matches": "/register*" } },
                { "not": { "href_matches": "/verify*" } },
                { "not": { "href_matches": "/forgot-password*" } },
                { "not": { "href_matches": "/reset-password*" } },
                { "not": { "href_matches": "/profile*" } },
                { "not": { "href_matches": "/change-password*" } },
                { "not": { "href_matches": "/my-dashboard*" } },
                { "not": { "href_matches": "/manage*" } },
                { "not": { "href_matches": "/logout*" } },
                { "not": { "href_matches": "/auth/*" } },
                { "not": { "href_matches": "/export*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
